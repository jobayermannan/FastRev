server {
  listen 80;
  root /usr/share/nginx/html;

  # Client-side routes such as /patients/123 must load the app on a full page refresh.
  location / {
    try_files $uri /index.html;
  }

  # Hashed bundles never change, so they can be cached for a long time; index.html is always revalidated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
